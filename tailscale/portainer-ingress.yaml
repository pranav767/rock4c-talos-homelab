# Private access to Portainer over the tailnet.
# Reachable at https://portainer.<your-tailnet>.ts.net from any device on your tailnet.
# No funnel annotation => private only.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portainer
  namespace: portainer
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: portainer
      port:
        number: 9000
  tls:
    - hosts:
        - portainer
